name: CI

on:
  push:
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release -j$(nproc)

      - name: Run Tests
        timeout-minutes: 45
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Dependencies via vcpkg
        run: vcpkg install dlfcn-win32:x64-windows pthreads:x64-windows

      - name: Configure CMake
        run: cmake -B build -S . -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        timeout-minutes: 60
        run: |
          cd build
          ctest --output-on-failure --timeout 1800 -C Release

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx breathe sphinx-rtd-theme

      - name: Generate Doxygen XML
        run: |
          mkdir -p doc/_build/doxygen
          doxygen doc/Doxyfile

      - name: Build Sphinx Documentation
        run: |
          mkdir -p doc/_build/html
          sphinx-build -b html doc/sphinx doc/_build/html

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: html-documentation
          path: doc/_build/html
